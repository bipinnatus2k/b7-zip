[workspace]
resolver = "3"

members = [
    "app",
    "cli",
    "crates/app_constants", "crates/app_env",
    "crates/archive_vfs",
    "crates/assets",
    "crates/bit7z",
    "crates/checksum",
    "crates/explorer",
    "crates/ffi",
    "crates/fs",
    "crates/format_detector",
    "crates/fs_watcher",
    "crates/password",
    "crates/paths",
    "crates/session",
    "crates/settings",
    "crates/settings_macros",
    "crates/system_specs",
    "crates/task",
    "crates/temp",
    "crates/thirdparties/gpui-tray",
    "crates/tray",
    "crates/ui_kit",
    "crates/vfs",
]

exclude = []
default-members = ["app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = [
    "async-io",
    "notification",
    "open_uri",
    "file_chooser",
    "settings",
    "trash",
] }
app_constants = { path = "crates/app_constants" }
archive_vfs = { path = "crates/archive_vfs" }
assets = { path = "crates/assets" }
async-channel = "2.5.0"
async-compat = "0.2.1"
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-dispatcher = "0.1"
async-fs = "2.1"
async-io = "2.6.0"
async-lock = "3.4.2"
async-pipe = { git = "https://github.com/zed-industries/async-pipe-rs", rev = "82d00a04211cf4e1236029aa03e6b6ce2a74c553" }
async-process = "2.5.0"
async-recursion = "1.0.0"
# `unstable` is required to compile async-tar's Windows symlink support.
async-std = { version = "1.12", features = ["unstable"] }
async-tar = "0.6"
async-task = "4.7"
async-trait = "0.1"
async-tungstenite = "0.31.0"
bit7z-ffi = { path = "crates/ffi" }
bit7z-rs = { path = "crates/bit7z" }
clap = { version = "4", features = ["derive"] }
collections = { git = "https://github.com/zed-industries/zed" }
const_format = "0.2"
crash-handler = "0.7"
checksum = { path = "crates/checksum" }
crashes = { path = "crates/crashes" }
dirs = "6.0"
explorer = { path = "crates/explorer" }
bit7z-explorer = { path = "crates/explorer" }
format_detector = { path = "crates/format_detector" }
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-tray = { path = "crates/thirdparties/gpui-tray" }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["runtime_shaders"] }
human_bytes = "0.4.3"
ignore = "0.4.22"
inventory = "0.3.24"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
log = "0.4.33"
mach2 = "0.5"
minidumper = "0.9"
parking_lot = "0.12.5"
password = { path = "crates/password" }
session = { path = "crates/session" }
path = { git = "https://github.com/zed-industries/zed" }
paths = { path = "crates/paths" }
pciid-parser = "0.8.1"
quote = "1.0.47"
rust-embed = { version = "8.11", features = ["include-exclude"] }
schemars = "1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
settings = { path = "crates/settings" }
settings_macros = { path = "crates/settings_macros" }
strum = "0.27"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
sysinfo = "0.39.6"
system_specs = { path = "crates/system_specs" }
task = { path = "crates/task" }
temp = { path = "crates/temp" }
ui_kit = { path = "crates/ui_kit" }
vfs = { path = "crates/vfs" }
fs = { path = "crates/fs" }
fs_watcher = { path = "crates/fs_watcher" }
tracing = "0.1"
util = { git = "https://github.com/zed-industries/zed" }
zstd = "0.11"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Data_Xml_Dom",
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_Notifications",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
]

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-component/pull/2149
useless_conversion = "allow"

[patch."https://github.com/zed-industries/scap"]
zed-scap = { path = "crates/thirdparties/scap" }

[patch.crates-io]
quick-xml = { git = "https://github.com/tafia/quick-xml", tag = "v0.41.0", version = "0.41.0" }

