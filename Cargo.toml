[workspace]
resolver = "3"

members = [
    "app",
    "cli",
    "crates/app_action",
    "crates/app_constants",
    "crates/archive_vfs",
    "crates/assets",
    "crates/bit7z",
    "crates/checksum",
    "crates/compare",
    "crates/crashes",
    "crates/etw_tracing",
    "crates/etw_tracing_ui",
    "crates/explorer",
    "crates/explorer-menu",
    "crates/explorer-menu-host",
    #    "crates/explorer_model",
    #    "crates/explorer_view",
    "crates/ffi",
    "crates/format_detector",
    "crates/fs",
    "crates/fs_watcher",
    "crates/multi-workspace-core",
    "crates/multi-workspace-demo",
    "crates/net",
    "crates/password",
    "crates/paths",
    "crates/platform_title_bar",
    "crates/release_channel",
    "crates/session",
    "crates/settings",
    "crates/signals",
    "crates/system_specs",
    "crates/task",
    "crates/temp",
    #    "crates/thirdparties/guise/crates/guise",
    "crates/thirdparties/gpui-router/crates/router",
    "crates/thirdparties/gpui-router/crates/router-macros",
    "crates/thirdparties/gpui-tray",
    "crates/tray",
    "crates/ui",
    "crates/vfs",
    "crates/windows_shell_extension",
    "crates/workspace",
    #    "crates/zlog",
    #    "crates/zlog_settings",
    #    "crates/ztracing",
    #    "crates/ztracing_macro",
    "executor",
]

exclude = ["crates/thirdparties/gpui-router", "crates/thirdparties/guise"]
default-members = ["app"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
version = "0.1.0"
authors = []
homepage = ""
documentation = ""
keywords = ["archive", "7-zip"]
categories = []
repository = ""

[workspace.dependencies]
anyhow = "1"
app_action = { path = "crates/app_action" }
app_constants = { path = "crates/app_constants" }
archive_vfs = { path = "crates/archive_vfs" }
assets = { path = "crates/assets" }
async-fs = "2.2"
async-process = "2.5.0"
async-trait = "0.1"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
bit7z-explorer = { path = "crates/explorer" }
explorer-menu = { path = "crates/explorer-menu" }
bit7z-ffi = { path = "crates/ffi" }
bit7z-rs = { path = "crates/bit7z" }
checksum = { path = "crates/checksum" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
collections = { package = "gpui-pre-collections", version = "0.3.4" }
compare = { path = "crates/compare" }
const_format = "0.2"
crash-handler = "0.7"
crashes = { path = "crates/crashes" }
dirs = "6.0"
dunce = "1.0"
etw_tracing = { path = "crates/etw_tracing" }
etw_tracing_ui = { path = "crates/etw_tracing_ui" }
explorer = { package = "bit7z-explorer", path = "crates/explorer" }
fs = { path = "crates/fs" }
fs_watcher = { path = "crates/fs_watcher" }
futures = "0.3"
futures-lite = "1.13"
globset = "0.4"
gpui = { package = "gpui-pre", version = "0.3.4", default-features = false }
gpui-kit = { version = "0.6", features = ["assets", "component"] }
gpui-router = { path = "crates/thirdparties/gpui-router/crates/router" }
gpui-router-macros = { path = "crates/thirdparties/gpui-router/crates/router-macros" }
gpui-tray = { path = "crates/thirdparties/gpui-tray" }
gpui_macros = { package = "gpui-pre-macros", version = "0.3.4" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.4" }
gpui_util = { package = "gpui-pre-util", version = "0.3.4" }
hashbrown = "0"
human_bytes = "0.4.3"
ignore = "0.4.33"
itertools = "0.14.0"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
log = "0.4.34"
mach2 = "0.5"
imara-diff = "0.1.8"
minidumper = "0.9"
multi-workspace-core = { path = "crates/multi-workspace-core" }
net = { path = "crates/net" }
nix = "0.29"
parking_lot = "0.12.5"
password = { path = "crates/password" }
path = { path = "crates/thirdparties/zed/path" }
paths = { path = "crates/paths" }
pciid-parser = "0.8.1"
percent-encoding = "2.3.2"
perf = { path = "crates/thirdparties/zed/tooling/perf" }
platform_title_bar = { path = "crates/platform_title_bar" }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
proc-macro2 = "1.0"
quote = "1"
rand = "0.9"
reactive-signals = { path = "crates/signals" }
regex = "1.13"
release_channel = { path = "crates/release_channel" }
rfd = { version = "0.15", default-features = false }
rust-embed = { version = "8.12", features = ["include-exclude"] }
rustix = { version = "1.1", features = ["fs"] }
schemars = { version = "1.2", features = ["indexmap2"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_json_lenient = { version = "0.2", features = [
    "preserve_order",
    "raw_value",
] }
session = { path = "crates/session" }
settings = { path = "crates/settings" }
shlex = "1.3.0"
smallvec = "1"
smol = "2.0.2"
syn = "2"
sysinfo = "0.39.6"
system_specs = { path = "crates/system_specs" }
take-until = "0.2.0"
task = { path = "crates/task" }
temp = { path = "crates/temp" }
tray = { path = "crates/tray" }
tempfile = "3"
thiserror = "2.0.20"
tracing = "0.1"
#guise-ui = { path = "crates/thirdparties/guise/crates/guise", default-features = false }
ui = { path = "crates/ui" }
unicase = "2.9"
unicode-bidi = { version = "0.3.18", default-features = false, features = [
    "hardcoded-data",
] }
unicode-script = "0.5.8"
unicode-segmentation = "1.13"
unicode-width = "0.2"
unindent = "0.2.4"
url = "2.5"
util = { path = "crates/thirdparties/zed/util" }
util_macros = { path = "crates/thirdparties/zed/util_macros" }
vfs = { path = "crates/vfs" }
walkdir = "2.5"
which = "6.0.3"
workspace = { path = "crates/workspace" }
zlog = { package = "gpui-pre-zlog", version = "0.3.4" }
zstd = "0.11"
ztracing = { package = "gpui-pre-ztracing", version = "0.3.4" }
ztracing_macro = { package = "gpui-pre-ztracing-macro", version = "0.3.4" }
windows-core = "0.61"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Data_Xml_Dom",
    "Foundation_Numerics",
    "Globalization_DateTimeFormatting",
    "Storage_Search",
    "Storage_Streams",
    "System_Threading",
    "UI_Notifications",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectManipulation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Hlsl",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",
]

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-component/pull/2149
useless_conversion = "allow"

[workspace.metadata.cargo-machete]
ignored = [
    "bindgen",
    "cbindgen",
    "prost_build",
    "serde",
    "component",
    "documented",
    "sea-orm-macros",
]

[patch."https://github.com/zed-industries/scap"]
zed-scap = { path = "crates/thirdparties/scap" }

#[patch.crates-io]
#gpui = { package = "gpui-pre", version = "0.3.4" }
#quick-xml = { git = "https://github.com/tafia/quick-xml", tag = "v0.41.0", version = "0.41.0" }

